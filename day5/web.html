<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - E-Commerce</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

/* Navigation */
nav{
    background:#222;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 60px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:orange;
}

/* Hero Section */
.hero{
    height:80vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600");
    background-size:cover;
    background-position:center;
    color:white;
}

.hero h1{
    font-size:55px;
}

.hero p{
    margin:20px 0;
    font-size:22px;
}

.hero button{
    padding:12px 30px;
    border:none;
    background:orange;
    color:white;
    font-size:18px;
    border-radius:5px;
    cursor:pointer;
}

.hero button:hover{
    background:#ff6600;
}

/* Products */
.products{
    padding:50px;
}

.products h2{
    text-align:center;
    margin-bottom:40px;
    font-size:36px;
}

.product-container{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    width:260px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h3{
    margin:15px;
}

.card p{
    margin-left:15px;
    color:green;
    font-size:22px;
    font-weight:bold;
}

.card button{
    margin:20px 15px;
    padding:10px 20px;
    background:#222;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

.card button:hover{
    background:orange;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

/* Responsive */
@media(max-width:768px){

nav{
    flex-direction:column;
}

nav ul{
    margin-top:15px;
}

.hero h1{
    font-size:38px;
}

.hero p{
    font-size:18px;
}

}
</style>

</head>
<body>

<!-- Navigation -->

<nav>
    <div class="logo">ShopEase</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<!-- Hero Section -->

<section class="hero">

<div>
<h1>Welcome to ShopEase</h1>
<p>Your One-Stop Online Shopping Destination</p>
<button>Shop Now</button>
</div>

</section>

<!-- Products -->

<section class="products">

<h2>Featured Products</h2>

<div class="product-container">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Shoes">
<h3>Running Shoes</h3>
<p>₹1,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Watch">
<h3>Smart Watch</h3>
<p>₹2,999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">
<h3>Headphones</h3>
<p>₹1,499</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" alt="Phone">
<h3>Smart Phone</h3>
<p>₹24,999</p>
<button>Add to Cart</button>
</div>

</div>

</section>

<!-- Footer -->

<footer>

<p>© 2026 ShopEase | All Rights Reserved</p>

</footer>

</body>
</html>
