<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <style>
        .box-parent {
             display: flex;
            justify-content: left;
            align-items: left;
            text-align: center;   
            height: 100vh;
            flex-direction: row;
        }
        .box-child-1 {
            width: 200px;
            height: 25px;
            background-color: red;
            p{
                color: white;
                font-size: 20px;
                text-align: center;
                margin-top:30px
            }
        }
        .box-child-2 {
            width: 250px;
            height: 25px;
            background-color: blue;
        }
        .box-child-3 {
            width: 300px;
            height: 25px;
            background-color: green;
        }
        .box-child-4 {
            width: 350px;
            height: 25px;
            background-color: yellow;
        }
    </style>
    <div class="box-parent ">
        <div class="box-child-1  text-white"><p>hello everyone</p></div>
        <div class="box-child-2  text-white">2</div>
        <div class="box-child-3  text-white">3</div>
        <div class="box-child-4  text-white d-none">4</div>
    </div>  
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
