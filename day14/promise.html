    <body>
        <script>
           
            function Register(){

                });
            }
            
            function Login(){
                return Promise.resolve("success");
            }
            
            function SignUp(){
                return Promise.reject("Failure");
            }
            
            function Signin(){
                let status=true;

                    }
                });
            }
