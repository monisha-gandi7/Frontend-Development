<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card p-4 shadow">

<h2 class="text-center">Quiz App</h2>

<h4 id="question"></h4>

<div id="options"></div>

<p class="mt-3" id="score"></p>

</div>

</div>

<script>

const quiz=[

{

question:"HTML stands for?",

options:["Hyper Text Markup Language","High Text","Home Tool"],

answer:0

},

{

question:"JavaScript is?",

options:["Programming Language","Database","Browser"],

answer:0

},

{

question:"CSS is used for?",

options:["Styling","Compiler","Operating System"],

answer:0

}

];

let index=0;

let marks=0;

function loadQuestion(){

if(index==quiz.length){

document.getElementById("question").innerHTML="Quiz Completed";

document.getElementById("options").innerHTML="";

document.getElementById("score").innerHTML="Score : "+marks+"/"+quiz.length;

return;

}

document.getElementById("question").innerHTML=quiz[index].question;

document.getElementById("options").innerHTML="";

quiz[index].options.forEach(function(option,i){

let btn=document.createElement("button");

btn.className="btn btn-outline-primary d-block my-2";

btn.innerHTML=option;

btn.onclick=function(){

if(i==quiz[index].answer){

marks++;

}

index++;

loadQuestion();

};

document.getElementById("options").appendChild(btn);

});

}

loadQuestion();

</script>

</body>

</html>
