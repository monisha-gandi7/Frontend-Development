<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Destructuring Examples</h1>
    <p>Here are some examples of destructuring in JavaScript:</p>
</body>
<script>
    // Array destructuring
    const numbers = [1, 2, 3, 4, 5];
    const [first, second, ...rest] = numbers;
    console.log(first); 
    console.log(second); 
    console.log(rest); 

    // Object destructuring
    const person = {
        name: 'John Doe',
        age: 30,
        address: {
            city: 'New York',
            country: 'USA'
        }
    };
    const { name, age, address: { city } } = person;
    console.log(name); 
    console.log(age); 
    console.log(city); 
</script>
</html>
